<f:layout name="Default" />

<f:section name="ExtendedTop">
    <f:if condition="{extendedTopContent}">
        <section class="extended-top">
            <f:for each="{extendedTopContent}" as="contentTopExtendedElement">
                <f:cObject
                    typoscriptObjectPath="tt_content.{contentTopExtendedElement.data.CType}"
                    data="{contentTopExtendedElement.data}"
                    table="tt_content"
                />
            </f:for>
        </section>
    </f:if>
</f:section>

<f:section name="Main">
    <f:if condition="{mainContent}">
        <main id="main" class="main">
            <f:for each="{mainContent}" as="contentMainElement">
                <f:cObject
                    typoscriptObjectPath="tt_content.{contentMainElement.data.CType}"
                    data="{contentMainElement.data}"
                    table="tt_content"
                />
            </f:for>
        </main>
    </f:if>
</f:section>

<f:section name="ExtendedBottom">
    <f:if condition="{extendedBottomContent}">
        <section class="extended-bottom">
            <f:for
                each="{extendedBottomContent}"
                as="contentBottomExtendedElement"
            >
                <f:cObject
                    typoscriptObjectPath="tt_content.{contentBottomExtendedElement.data.CType}"
                    data="{contentBottomExtendedElement.data}"
                    table="tt_content"
                />
            </f:for>
        </section>
    </f:if>
</f:section>
