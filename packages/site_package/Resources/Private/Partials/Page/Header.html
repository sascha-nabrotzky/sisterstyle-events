<header class="main-header">
    <div class="logo" aria-hidden="true">
        <f:cObject
            typoscriptObjectPath="lib.inlineSvg"
            data="{src:'EXT:site_package/Resources/Public/Icons/sisterstyle-logo.svg'}"
        />
    </div>

    <nav class="main-nav" aria-label="Hauptnavigation">
        <f:link.page
            pageUid="{startpage_id}"
            class="nav-item {f:if(condition: '{startpage_id} == {data.uid}', then: 'active')}"
        >
            Startseite
        </f:link.page>
        <f:for each="{mainNavigation}" as="mainNavItem">
            <f:link.page
                pageUid="{mainNavItem.data.uid}"
                class="nav-item {f:if(condition: mainNavItem.active, then: 'active')}"
            >
                {mainNavItem.title}
            </f:link.page>
        </f:for>
    </nav>
    <div class="socialmedia-links" aria-label="Social Media Links">
        <f:link.external
            uri="https://www.instagram.com/sisterstyleevents"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-item"
        >
            <f:cObject
                typoscriptObjectPath="lib.inlineSvg"
                data="{src:'EXT:site_package/Resources/Public/Icons/instagram.svg'}"
            />
        </f:link.external>
    </div>
</header>
