<header class="main-header">
    <div class="logo">
        <f:cObject
            typoscriptObjectPath="lib.inlineSvg"
            data="{src:'EXT:site_package/Resources/Public/Icons/sisterstyle-logo.svg'}"
        />
    </div>

    <nav class="main-nav">
        <f:link.page
            pageUid="{startpage_id}"
            class="nav-item {f:if(condition: '{startpage_id} == {data.uid}', then: 'active')}"
        >
            Home
        </f:link.page>
        <f:for each="{mainNavigation}" as="mainNavItem">
            <f:link.page
                pageUid="{mainNavItem.data.uid}"
                class="nav-item {f:if(condition: mainNavItem.active, then: 'active')}"
            >
                {mainNavItem.title}
            </f:link.page>
        </f:for>
    </nav>

    <f:if condition="{data.media}">
        <div class="hero-image-container">
            <div class="hero-overlay-line"></div>
            <div class="hero-image">
                <f:cObject typoscriptObjectPath="lib.headerImage" />
            </div>
            <div class="hero-overlay-surface"></div>
        </div>
    </f:if>
</header>
