<f:asset.css
    identifier="content-block-css-sn/images-collection"
    href="{cb:assetPath()}/frontend.css"
/>

<div
    id="{data.uid}"
    class="package-slider {data -> f:render.text(field: 'header')}"
>
    <header>
        <h2 class="headline">{data.header}</h2>
    </header>
    <ul class="content-list">
        <f:for each="{data.collection1}" as="content-item">
            <li>{content-item.text}</li>
        </f:for>
    </ul>
    <div
        class="image-collection"
        tabindex="0"
        role="region"
        aria-label="Paketbilder"
    >
        <f:for each="{data.collection2}" as="item">
            <f:for each="{item.image}" as="image">
                <figure>
                    <div class="image-wrapper">
                        <f:image
                            image="{image}"
                            alt="{image.alternative}"
                            cropVariant="default"
                            maxWidth="700"
                            loading="lazy"
                        />
                    </div>
                    <figcaption>
                        {f:if(condition: image.description, then:
                        image.description, else: image.alternative)}
                    </figcaption>
                </figure>
            </f:for>
        </f:for>
    </div>
</div>
