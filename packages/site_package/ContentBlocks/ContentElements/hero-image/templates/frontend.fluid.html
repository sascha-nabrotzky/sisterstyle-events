<f:asset.css
    identifier="content-block-css-sn-sn/hero-image"
    href="{cb:assetPath()}/frontend.css"
/>
<f:asset.script
    identifier="content-block-js-sn-sn/hero-image"
    src="{cb:assetPath()}/frontend.js"
/>

<div id="hero-image" class="hero-image-container">
    <header>
        <h1>{data -> f:render.text(field: 'header')}</h1>
        <h2>{data -> f:render.text(field: 'subheader')}</h2>
    </header>
    <div class="hero-image">
        <f:for each="{data.image}" as="image">
            <f:image
                image="{image}"
                alt="{f:if(condition: image.alternative, then: image.alternative, else: ' ')}"
            />
        </f:for>
    </div>
</div>
